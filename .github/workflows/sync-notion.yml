name: Sync Notion data

on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch: {}       # botón "Run workflow" manual en la pestaña Actions
  push:
    branches: [main]
    paths:
      - "scripts/sync-notion.mjs"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Omitir sync si faltan secrets
        if: ${{ secrets.NOTION_TOKEN == '' || secrets.NOTION_DB_CALENDAR == '' || secrets.NOTION_DB_STUDY == '' }}
        run: echo "Faltan secrets de Notion; se omite el sync."

      - name: Traer datos de Notion
        if: ${{ secrets.NOTION_TOKEN != '' && secrets.NOTION_DB_CALENDAR != '' && secrets.NOTION_DB_STUDY != '' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_CALENDAR: ${{ secrets.NOTION_DB_CALENDAR }}
          NOTION_DB_STUDY: ${{ secrets.NOTION_DB_STUDY }}
        run: node scripts/sync-notion.mjs

      - name: Commitear data.json si cambió
        if: ${{ secrets.NOTION_TOKEN != '' && secrets.NOTION_DB_CALENDAR != '' && secrets.NOTION_DB_STUDY != '' }}
        run: |
          git config user.name "semestre-en-flor-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "chore: sync datos de Notion"
            git push
          else
            echo "Sin cambios en data.json"
          fi
